version: '3.8'

services:
  fastapi:
    image: aybr/fastapi_first
    container_name: FastAPI_App
    ports:
      - "80:8000"
    env_file:
      - .env.prod
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    container_name: Postgres_DB
    environment:
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=fastapi
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
